<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1113" id="metaTheme">
<meta name="description" content="Treino Simples: personal trainer adaptativo com aquecimento, treino, corrida, evolucao e descanso.">
<title>Treino Simples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0e1113; --surface:#161b1e; --surface2:#1e2529; --line:#2b3439;
  --text:#eef2f4; --muted:#8fa0a8; --accent:#5ad1c0; --accent2:#e0b466;
  --ok:#5fd08a; --warn:#e8b04a; --danger:#e2685c;
  --accent-soft:rgba(90,209,192,.13); --accent-line:rgba(90,209,192,.34);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --ff-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --ff-b:'Barlow','Segoe UI',system-ui,sans-serif;
  --ff-m:'JetBrains Mono',ui-monospace,monospace;
  --r:8px; --r2:14px; --pad:16px; --nav:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--text);font-family:var(--ff-b);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .45s,color .45s}
#app{max-width:820px;margin:0 auto;padding:0 var(--pad);position:relative;z-index:1}
.pad-nav{padding-bottom:calc(var(--nav) + 28px + env(safe-area-inset-bottom))}

h1,h2,h3,h4{font-family:var(--ff-d);font-weight:600;margin:0;line-height:1.12;letter-spacing:.01em}
.eyebrow{font-family:var(--ff-d);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mut{color:var(--muted)} .sm{font-size:13.5px} .xs{font-size:12px}
.num{font-family:var(--ff-m);font-variant-numeric:tabular-nums}
.center{text-align:center} .hide{display:none!important}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:17px;margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15px;letter-spacing:.13em;text-transform:uppercase}
.card-h h2{font-size:22px}

.hero-plate{background:linear-gradient(145deg,var(--surface2),var(--surface));
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r2);padding:18px;margin-top:14px}
.hero-plate h1{font-size:26px;margin:3px 0 6px}
.hero-plate.rest{border-left-color:var(--accent2)}
.hero-plate.done{border-left-color:var(--ok)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-family:var(--ff-m);font-size:11px;padding:5px 9px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:700}
.chip.a{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.a b{color:var(--accent)}
.chip.g{background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 36%,transparent);color:var(--ok)}
.chip.w{background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 36%,transparent);color:var(--warn)}
.chip.d{background:color-mix(in srgb,var(--danger) 13%,transparent);border-color:color-mix(in srgb,var(--danger) 36%,transparent);color:var(--danger)}
.chip.s{background:color-mix(in srgb,var(--accent2) 13%,transparent);border-color:color-mix(in srgb,var(--accent2) 36%,transparent);color:var(--accent2)}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r);margin-top:12px;
  font-size:13.5px;border:1px solid var(--line);background:var(--surface2)}
.note b{display:block;font-family:var(--ff-d);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.note p{margin:0;color:var(--muted);font-size:13px}
.note.a{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.note.g{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 32%,transparent);color:var(--ok)}
.note.w{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn)}
.note.d{background:color-mix(in srgb,var(--danger) 10%,transparent);border-color:color-mix(in srgb,var(--danger) 32%,transparent);color:var(--danger)}
.note.s{background:color-mix(in srgb,var(--accent2) 10%,transparent);border-color:color-mix(in srgb,var(--accent2) 32%,transparent);color:var(--accent2)}

button{font-family:var(--ff-b);cursor:pointer;border-radius:var(--r);transition:.16s;border:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px 14px;font-size:13.5px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.tiny{padding:6px 10px;font-size:11.5px;font-family:var(--ff-m)}
.btn.full{width:100%}
.btn.pri{background:var(--accent);color:var(--bg);border:1px solid var(--accent);
  font-family:var(--ff-d);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:15px}
.btn.pri:hover:not(:disabled){filter:brightness(1.09);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.dgr{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.row-btn{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row-btn>*{flex:1;min-width:110px}

label.fl{display:block;font-family:var(--ff-d);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r);padding:10px 11px;font-family:var(--ff-m);font-size:14.5px}
textarea{font-family:var(--ff-b);resize:vertical;min-height:82px}
select{font-family:var(--ff-b)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{min-width:0}

.wrap-center{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:36px 0}
.mark{font-family:var(--ff-d);font-size:44px;font-weight:700;letter-spacing:.03em;line-height:.98;text-transform:uppercase}
.mark span{color:var(--accent)}
.rule{height:2px;background:var(--accent);width:54px;margin:16px 0}

.steps{display:flex;gap:5px;margin-bottom:20px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.3s}
.steps i.on{background:var(--accent)}

.opts{display:grid;gap:9px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r);padding:13px 14px;font-size:14.5px}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .bx{width:21px;height:21px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;transition:.15s}
.opt.rd .bx{border-radius:50%}
.opt.on .bx{background:var(--accent);border-color:var(--accent)}
.opt .bx svg{width:12px;height:12px;stroke:var(--bg);stroke-width:3.4;fill:none;opacity:0}
.opt.on .bx svg{opacity:1}
.opt .tx b{display:block;font-family:var(--ff-d);font-size:15.5px;font-weight:600;letter-spacing:.02em}
.opt .tx small{color:var(--muted);font-size:12.5px}
.opt.pill{justify-content:center;padding:15px 8px}
.opt.pill .tx b{font-size:22px;font-family:var(--ff-m)}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.theme{border:1.5px solid var(--line);border-radius:var(--r2);padding:11px;cursor:pointer;transition:.16s;overflow:hidden}
.theme:hover{transform:translateY(-2px)}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme .tname{font-family:var(--ff-d);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.theme .swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;height:26px}
.theme .swatches i{border-radius:3px;display:block}
.theme .tmeta{font-family:var(--ff-m);font-size:9.5px;margin-top:7px;opacity:.7}

.blk{margin-top:16px}
.blk-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.blk-h .n{font-family:var(--ff-m);font-size:11px;font-weight:700;color:var(--bg);background:var(--muted);border-radius:4px;padding:2px 7px}
.blk-h h3{flex:1;font-size:14.5px;letter-spacing:.14em;text-transform:uppercase}
.blk-h .m{font-family:var(--ff-m);font-size:11px;color:var(--muted)}

.ex{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:.18s}
.ex.on{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.ex.on .exn{color:var(--muted);text-decoration:line-through}
.ex-top{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;cursor:pointer}
.tick{width:24px;height:24px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;margin-top:1px;transition:.16s}
.ex.on .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{width:13px;height:13px;stroke:var(--bg);stroke-width:3.4;fill:none;opacity:0;transition:.16s}
.ex.on .tick svg{opacity:1}
.exb{flex:1;min-width:0}
.exn{font-family:var(--ff-d);font-size:16px;font-weight:600}
.exp{font-family:var(--ff-m);font-size:12px;color:var(--accent);margin-top:2px}
.exs{font-size:12.5px;color:var(--muted);margin-top:3px}
.ex-log{display:flex;gap:8px;padding:0 13px 11px;flex-wrap:wrap}
.ex-log .fld{flex:1;min-width:92px}
.ex-tools{display:flex;gap:6px;padding:0 13px 11px;flex-wrap:wrap}

.prog{margin-top:12px}
.prog-t{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:11px;color:var(--muted);margin-bottom:5px}
.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li-i{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r);display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:16px}
.li-b{flex:1;min-width:0}
.li-b b{display:block;font-family:var(--ff-d);font-size:15px;font-weight:600}
.li-b span{font-family:var(--ff-m);font-size:11.5px;color:var(--muted)}
.li-r{flex:0 0 auto;text-align:right;font-family:var(--ff-m);font-size:11.5px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px 7px;text-align:center}
.stat b{display:block;font-family:var(--ff-m);font-size:19px;font-weight:700;color:var(--accent)}
.stat span{display:block;font-family:var(--ff-d);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}

.rd{margin-bottom:12px}
.rd-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.rd-h b{font-family:var(--ff-m);color:var(--accent)}
input[type=range]{-webkit-appearance:none;background:transparent;border:none;padding:0;height:24px}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--surface2);border-radius:3px}
input[type=range]::-moz-range-track{height:5px;background:var(--surface2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-7.5px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}

.wk{display:grid;gap:8px;margin-top:12px}
.wd{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);padding:12px 13px;cursor:pointer;text-align:left;width:100%}
.wd:hover{border-color:var(--accent)}
.wd.today{border-left-color:var(--accent2)}
.wd.done{border-left-color:var(--ok)}
.wd.rest{border-left-color:var(--muted)}
.wd-d{width:42px;flex:0 0 auto;text-align:center}
.wd-d b{display:block;font-family:var(--ff-d);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.wd-d i{display:block;font-family:var(--ff-m);font-size:18px;font-weight:700;font-style:normal}
.wd-b{flex:1;min-width:0}
.wd-b b{display:block;font-family:var(--ff-d);font-size:15.5px;font-weight:600}
.wd-b span{font-size:12.5px;color:var(--muted)}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));
  z-index:60;background:var(--surface2);border:1px solid var(--accent);border-radius:999px;
  padding:9px 15px;display:none;align-items:center;gap:11px;box-shadow:var(--shadow)}
.timer.on{display:flex}
.timer b{font-family:var(--ff-m);font-size:19px;font-weight:700;color:var(--accent);min-width:52px;text-align:center}
.timer button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 9px;font-size:11px;font-family:var(--ff-m)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs.on{display:grid}
nav.tabs button{background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);position:relative;border-radius:0}
nav.tabs button em{font-size:17px;font-style:normal;line-height:1}
nav.tabs button span{font-family:var(--ff-d);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:'';position:absolute;top:0;left:24%;right:24%;height:2px;background:var(--accent)}

header.bar{position:sticky;top:0;z-index:40;margin:0 calc(var(--pad)*-1);padding:11px var(--pad);
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.bar .id{flex:1;min-width:0}
header.bar .id b{font-family:var(--ff-d);font-size:17px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:block}
header.bar .id span{font-family:var(--ff-m);font-size:10px;color:var(--muted)}

.ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:820px;max-height:88svh;overflow-y:auto;
  padding:18px var(--pad) calc(26px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h3{font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.x{background:var(--surface2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;font-size:17px}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px);transform:translate(-50%,14px);
  background:var(--surface2);border:1px solid var(--accent);color:var(--text);
  padding:11px 17px;border-radius:var(--r);font-size:13.5px;z-index:200;opacity:0;
  pointer-events:none;transition:.26s;max-width:88vw;text-align:center;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

canvas{display:block;max-width:100%}
.lnk{background:none;border:none;color:var(--accent);padding:8px 4px;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.auth-err{color:var(--danger);font-size:13px;margin:10px 0 0;min-height:18px}
.auth-ok{color:var(--ok);font-size:13px;margin:10px 0 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{text-align:center;padding:24px 0 10px;font-family:var(--ff-m);font-size:10.5px;color:var(--muted)}
.view{display:none}
.view.on{display:block;animation:fade .28s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(min-width:620px){.themes{grid-template-columns:repeat(4,1fr)}.mark{font-size:56px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app" class="pad-nav">
  <div id="screen"></div>
  <div class="foot" id="foot"></div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="hoje" class="on"><em>&#9672;</em><span>Hoje</span></button>
  <button data-tab="semana"><em>&#9638;</em><span>Semana</span></button>
  <button data-tab="evolucao"><em>&#9721;</em><span>Evolução</span></button>
  <button data-tab="historico"><em>&#8801;</em><span>Histórico</span></button>
  <button data-tab="perfis"><em>&#9673;</em><span>Perfis</span></button>
</nav>

<div class="timer" id="timer">
  <b id="timerVal">0:00</b>
  <button data-t="add">+30s</button>
  <button data-t="stop">Parar</button>
</div>

<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   TREINO SIMPLES v9
   ================================================================ */

/* ---------------- 0. UTILITÁRIOS ---------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const todayKey=()=>iso(new Date());
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const DOWL=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DOWF=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtBR=k=>{const d=parseKey(k);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const timeToSec=t=>{if(!t)return 0;const p=String(t).split(':').map(Number);
  return p.length===2?p[0]*60+p[1]:(p.length===3?p[0]*3600+p[1]*60+p[2]:Number(t)||0)};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2300)}

/* ================================================================
   1. MOTOR DE COR
   Converte HSL em hex e garante contraste conforme WCAG, de modo
   que nenhum tema gerado saia ilegível.
   ================================================================ */
function hsl2hex(h,s,l){
  h=((h%360)+360)%360; s=clamp(s,0,100)/100; l=clamp(l,0,100)/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0];
  else if(h<180)[r,g,b]=[0,c,x]; else if(h<240)[r,g,b]=[0,x,c];
  else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const f=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+f(r)+f(g)+f(b);
}
function hex2rgb(hex){
  const h=hex.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function lum(hex){
  const [r,g,b]=hex2rgb(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrast(a,b){
  const l1=lum(a), l2=lum(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
/* Ajusta a luminosidade até atingir o contraste mínimo pedido. */
function fixContrast(h,s,l,bgHex,target,dark){
  let step=dark?2:-2, tries=0, cur=l;
  while(contrast(hsl2hex(h,s,cur),bgHex)<target && tries<48){ cur=clamp(cur+step,4,97); tries++; }
  return hsl2hex(h,s,cur);
}

/* ================================================================
   2. LEITURA SEMÂNTICA
   O texto livre e as escolhas viram um matiz-base e um índice de
   intensidade. Como o matiz também depende de um hash do texto,
   duas pessoas da mesma profissão recebem cores diferentes.
   ================================================================ */
const FAMILIES=[
  {k:'tatico', hue:100, w:['polic','militar','tátic','tatic','operacion','segur','guarda','bombeir','patrulh','forças','forca armada','exército','exercito','marinha','aeronáut','gpi','bope','core','choque','agente','perícia','pericia','vigil']},
  {k:'combate', hue:14,  w:['luta','mma','boxe','jiu','muay','karate','karatê','judô','judo','combate','competi','crossfit','powerlifting','strongman','levantamento','halterofil']},
  {k:'arte',    hue:305, w:['danç','danc','ballet','balé','bale','bailar','ginást','ginast','artist','músic','music','teatro','circo','acrobac','pole','yoga','pilates','alongamento','flexibilidade']},
  {k:'natureza',hue:150, w:['trilha','montanha','natureza','ar livre','outdoor','escalad','ciclis','bike','pedal','aventura','camping','floresta','campo','rural','surf']},
  {k:'agua',    hue:196, w:['nataç','natac','nado','piscin','triatl','remo','mergulh','água','agua','praia','vela','canoa']},
  {k:'tecnico', hue:214, w:['engenh','program','desenvolv','software','dados','tecnolog','ti ','analis','cientis','pesquis','médic','medic','enferm','saúde','saude','profess','advog','contab','administra','escritório','escritorio']},
  {k:'corrida', hue:36,  w:['corrida','corredor','maratona','running','pista','atletismo','velocidad','sprint','meia mara']}
];
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return Math.abs(h); }
function readSemantics(p){
  const raw=[p.name||'',p.identity||'',(p.goals||[]).join(' '),(p.locations||[]).join(' ')].join(' ');
  const t=raw.toLowerCase();
  let best=null, bestScore=0;
  FAMILIES.forEach(f=>{ const s=f.w.filter(w=>t.includes(w)).length; if(s>bestScore){bestScore=s;best=f;} });
  const hash=hashStr(raw||'padrao');
  const jitter=(hash%40)-20;
  const hue = best ? ((best.hue+jitter)+360)%360 : hash%360;
  /* intensidade: 0 = leve e claro, 1 = denso e escuro */
  let intensity=0.5;
  if(best){
    if(['tatico','combate'].includes(best.k)) intensity=0.85;
    else if(['natureza','corrida','agua'].includes(best.k)) intensity=0.55;
    else if(best.k==='arte') intensity=0.2;
    else intensity=0.45;
  }
  const goals=p.goals||[];
  if(goals.includes('operacional')) intensity+=0.08;
  if(goals.includes('estetica')||goals.includes('hipertrofia')) intensity-=0.08;
  if(goals.includes('mobilidade')||goals.includes('saude')) intensity-=0.1;
  return {hue,intensity:clamp(intensity,0,1),family:best?best.k:'neutro',seed:hash};
}

/* ================================================================
   3. GERADOR DE TEMAS
   Oito receitas fixas em estrutura, variáveis em matiz. Quatro
   escuras e quatro claras, cada uma com harmonia própria.
   ================================================================ */
const HUE_NAMES=[[15,'Brasa'],[42,'Âmbar'],[68,'Ocre'],[95,'Musgo'],[135,'Selva'],[162,'Jade'],[186,'Turquesa'],
  [205,'Oceano'],[228,'Índigo'],[258,'Violeta'],[288,'Ametista'],[315,'Magenta'],[340,'Carmim'],[361,'Brasa']];
const hueName=h=>{h=((h%360)+360)%360; for(const[lim,n] of HUE_NAMES){ if(h<lim) return n; } return 'Brasa';};

  {id:'l4',dark:0,name:'Papel',        dh:+40, h2:+120, sA:42, sBg:4,  lBg:98}
];

function buildTheme(rec,baseHue,seed){
  const h  = ((baseHue+rec.dh)%360+360)%360;
  const h2 = ((h+rec.h2)%360+360)%360;
  const D  = rec.dark;
  const bg       = hsl2hex(h, rec.sBg, rec.lBg);
  const surface  = hsl2hex(h, rec.sBg*0.9, D?rec.lBg+4.5:rec.lBg-4);
  const surface2 = hsl2hex(h, rec.sBg*0.85,D?rec.lBg+9  :rec.lBg-8.5);
  const line     = hsl2hex(h, rec.sBg*0.7, D?rec.lBg+15 :rec.lBg-16);
  /* contraste garantido contra o fundo */
  const text   = fixContrast(h, D?9:16,  D?96:12, bg, 12, D);
  const muted  = fixContrast(h, D?11:14, D?62:40, bg, 4.6, D);
  const accent = fixContrast(h,  rec.sA, D?62:42, bg, 4.6, D);
  const accent2= fixContrast(h2, rec.sA-6, D?60:44, bg, 4.6, D);
  const ok     = fixContrast(148, 46, D?60:38, bg, 4.6, D);
  const warn   = fixContrast(40,  62, D?62:44, bg, 4.6, D);
  const danger = fixContrast(6,   58, D?62:46, bg, 4.6, D);
  const [ar,ag,ab]=hex2rgb(accent);
  return {
    id:rec.id, light:!D, hue:h,
    label:`${rec.name} · ${hueName(h)}`,
    bg,surface,surface2,line,text,muted,accent,accent2,ok,warn,danger,
    accentSoft:`rgba(${ar},${ag},${ab},${D?.13:.11})`,
    accentLine:`rgba(${ar},${ag},${ab},${D?.34:.40})`
  };
}
function generateThemes(profile){
  const sem=readSemantics(profile);
  /* Temas escuros primeiro quando a leitura indica contexto intenso. */
  const ordered = sem.intensity>=0.5
    ? RECIPES.slice()
    : [...RECIPES.filter(r=>!r.dark),...RECIPES.filter(r=>r.dark)];
  return {sem, themes: ordered.map(r=>buildTheme(r,sem.hue,sem.seed))};
}
/* Regenera um tema já escolhido com outro matiz base, mantendo a
   mesma "textura" (claro/escuro, saturação, contraste) da receita
   original — usado no editor simples de cor das Configurações. */
function retintTheme(themeId,newHue,seed){
  const rec=RECIPES.find(r=>r.id===themeId)||RECIPES[0];
  return buildTheme(rec,newHue,seed||0);
}
function applyTheme(t){
  if(!t) return;
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--surface',t.surface);
  r.setProperty('--surface2',t.surface2); r.setProperty('--line',t.line);
  r.setProperty('--text',t.text); r.setProperty('--muted',t.muted);
  r.setProperty('--accent',t.accent); r.setProperty('--accent2',t.accent2);
  r.setProperty('--ok',t.ok); r.setProperty('--warn',t.warn); r.setProperty('--danger',t.danger);
  r.setProperty('--accent-soft',t.accentSoft); r.setProperty('--accent-line',t.accentLine);
  r.setProperty('--shadow',t.light?'0 10px 30px rgba(0,0,0,.10)':'0 10px 30px rgba(0,0,0,.35)');
  const m=$('#metaTheme'); if(m) m.setAttribute('content',t.bg);
}
function themeSwatches(t){
  return [t.bg,t.surface,t.surface2,t.accent,t.accent2,t.ok,t.warn,t.text]
    .map(c=>`<i style="background:${c}"></i>`).join('');
}

function blockWeek(dateKey,startKey){
  const d=Math.floor((parseKey(dateKey)-parseKey(startKey||dateKey))/864e5);
  return ((Math.floor(d/7)%4)+4)%4+1;
}

/* ---------------- IMC (referência, nunca diagnóstico) ---------------- */
function calcIMC(pesoKg,alturaCm){
  const h=(Number(alturaCm)||0)/100;
  if(!h||!pesoKg) return null;
  const v=Number(pesoKg)/(h*h);
  let faixa='dentro da faixa usual';
  if(v<18.5) faixa='abaixo da faixa usual';
  else if(v>=25&&v<30) faixa='acima da faixa usual';
  else if(v>=30) faixa='bem acima da faixa usual';
  return {valor:Math.round(v*10)/10,faixa};
}

/* ---------------- 6. ARQUÉTIPOS DE SESSÃO ---------------- */
/* O objetivo PRINCIPAL escolhe a família-base da semana. Até dois
   objetivos secundários adicionam ou substituem uma sessão, nunca
   mudam a coluna vertebral do plano. */
function allocate(days,goalsArr,mainGoal){
  const fam=id=>GOALS[id]?GOALS[id].fam:'saude';
  const mainFam = fam(mainGoal||goalsArr[0]);
  const secArr = goalsArr.filter(g=>g!==mainGoal).slice(0,2);
  const secFams = secArr.map(fam);
  const has=f=>mainFam===f||secFams.includes(f);
  const condDay = has('taf') ? 'TAF' : (has('condicionamento') ? 'METCON' : 'METCON');

  /* --- família TAF: teste físico específico manda na estrutura --- */
  if(mainFam==='taf'){
    if(days===2) return ['TAF','UPPER'];
    if(days===3) return ['TAF','UPPER','RUN'];
    if(days===4) return ['TAF','UPPER','RUN','LOWER'];
    return ['TAF','UPPER','RUN','LOWER','TAF'];
  }
  /* --- família corrida --- */
  if(mainFam==='corrida'){
    if(days===2) return ['RUN','FULL'];
    if(days===3) return ['RUN','FULL','RUN'];
    if(days===4) return ['RUN','LOWER','RUN','UPPER'];
    return ['RUN','LOWER','RUN','UPPER','RUN'];
  }
  /* --- família mobilidade --- */
  if(mainFam==='mobilidade'){
    if(days===2) return ['MOB','MOB'];
    if(days===3) return ['MOB','FULL','MOB'];
    if(days===4) return ['MOB','LOWER','MOB','UPPER'];
    return ['MOB','LOWER','MOB','UPPER','FULL'];
  }
  /* --- família saúde: conservador, corpo inteiro predominante --- */
  if(mainFam==='saude'){
    if(days===2) return ['FULLA','FULLB'];
    if(days===3) return ['FULL','FULL','MOB'];
    if(days===4) return ['LOWER','UPPER','FULL','MOB'];
    return ['LOWER','UPPER','FULL','MOB','FULL'];
  }
  /* --- família emagrecimento: força + condicionamento intercalados --- */
  if(mainFam==='emagrecimento'){
    if(days===2) return ['FULLA','METCON'];
    if(days===3) return ['FULL','METCON','FULL'];
    if(days===4) return ['LOWER','UPPER','METCON','FULL'];
    return ['LOWER','UPPER','METCON','FULL','METCON'];
  }
  /* --- família hipertrofia: mais divisão, mais volume --- */
  if(mainFam==='hipertrofia'){
    if(days===2) return ['FULLA','FULLB'];
    if(days===3) return ['LOWER','UPPER','FULL'];
    if(days===4) return ['LOWER','UPPER','LOWER2','UPPER2'];
    return ['LOWER','UPPER','FULL','LOWER2','UPPER2'];
  }
  /* --- família condicionamento (inclui operacional) --- */
  if(mainFam==='condicionamento'){
    if(days===2) return ['METCON','FULL'];
    if(days===3) return ['LOWER','UPPER',condDay];
    if(days===4) return ['LOWER','UPPER',condDay,'FULL'];
    if(has('corrida')) return ['LOWER','UPPER',condDay,'RUN','FULL'];
    return ['LOWER','UPPER',condDay,'FULL',condDay];
  }
  /* --- família força (padrão) --- */
  if(days===2) return ['FULLA','FULLB'];
  if(days===3){
    if(has('condicionamento')||has('taf')) return ['LOWER','UPPER',condDay];
    return ['LOWER','UPPER','FULL'];
  }
  if(days===4){
    if(has('hipertrofia')&&!has('condicionamento')&&!has('taf')) return ['LOWER','UPPER','LOWER2','UPPER2'];
    return ['LOWER','UPPER',condDay,'FULL'];
  }
  if(has('hipertrofia')&&!has('condicionamento')&&!has('taf')) return ['LOWER','UPPER','FULL','LOWER2','UPPER2'];
  if(has('condicionamento')&&has('taf'))        return ['LOWER','UPPER','METCON','TAF','FULL'];
  if(has('condicionamento')||has('taf'))        return ['LOWER','UPPER',condDay,'RUN','FULL'];
  return ['LOWER','UPPER','FULL','METCON','LOWER2'];
}

/* ================================================================
   9. GERADOR DE SESSÃO
   Recebe perfil e data e devolve a programação completa do dia,
   incluindo descanso. Nenhum dia fica sem plano.
   ================================================================ */
function buildSession(p,dateKey){
  const dow=parseKey(dateKey).getDay();
  const bw=blockWeek(dateKey,p.cycleStart);
  const B=BLOCKS[bw], L=LEVELS[p.level]||LEVELS.intermediate;
  const goals=p.goals&&p.goals.length?p.goals:['forca'];
  const daysArr=FREQ[p.days]||FREQ[3];
  const idx=daysArr.indexOf(dow);
  const mainGoal = (p.mainGoal&&goals.includes(p.mainGoal)) ? p.mainGoal : goals[0];
  const S={dateKey,dow,bw,block:B,level:L,rpe:(B.nome==='CHOQUE'?L.rpe.split('–').pop():B.rpe),goals,mainGoal};

  /* ---- dia de descanso ---- */
  if(idx===-1){
    S.isRest=true; S.title='Descanso ativo'; S.icon='○';
    S.focus='Recuperação é parte do plano. A adaptação acontece agora, não no treino.';
    S.dur='15–30 min'; S.warm=[];
    S.blocks=[{n:'Protocolo de recuperação',meta:'Sem carga · marque o que cumprir',
      it:[['respiracao','5 min'],['mobQuadril','8 transições por lado'],['mobToracica','10 por lado'],
          ['alongGeral','5 posições de 40 s'],['caminhada','20–30 min opcional']]}];
    return S;
  }

  const arch=allocate(p.days,goals,mainGoal)[idx]||'FULL';
  const A=ARCH[arch];
  const CB=comebackOn(p,dateKey);
  if(CB){ S.comeback=CB; S.rpe=CB.rpe; }
  const s=b=>Math.max(2,b+B.ds+L.ds-(CB?1:0));         /* séries ajustadas (−1 na retomada) */
  /* taf = TAF específico foi escolhido; nunca inferido de "desempenho atlético" */
  const taf=goals.includes('taf');
  const est=goals.includes('estetica')||goals.includes('hipertrofia');
  const cond=goals.includes('condicionamento')||goals.includes('operacional');
  const forca=mainGoal==='forca';
  const desemp=goals.includes('desempenho');
  S.arch=arch; S.title=A.t; S.focus=A.f; S.isRest=false;
  S.dur=(arch==='RUN'||arch==='MOB')?'30–45 min':'45–60 min';
  S.icon={LOWER:'◧',LOWER2:'◧',UPPER:'◨',UPPER2:'◨',FULL:'▣',FULLA:'▣',FULLB:'▣',METCON:'◈',TAF:'★',RUN:'➤',MOB:'◯'}[arch]||'▣';
  S.warm=arch==='RUN'?WARM.run:(arch==='METCON'?WARM.cond:(arch==='MOB'?WARM.inf:
        (arch.startsWith('UPPER')?WARM.sup:(arch.startsWith('LOWER')?WARM.inf:WARM.full))));
  S.blocks=[];
  const rest={forca:'Descanso 2–3 min',sec:'Descanso 90 s',acc:'Descanso 45–60 s'};

  if(arch==='LOWER'){
    S.blocks.push({n:'Força principal',meta:rest.forca,it:[['agacho',`${s(4)} × ${forca?'5':'6–8'}`],['terra',`${s(3)} × 6`]]});
    S.blocks.push({n:'Acessórios',meta:rest.sec,it:[['afundo',`${s(3)} × 10 por perna`],['flexora',`${s(3)} × 12`],['panturrilha',`${s(3)} × 15`]]});
    S.blocks.push({n:'Tronco',meta:rest.acc,it: taf?[['abdominal',`${s(3)} × 40 s em ritmo`],['pallof',`${s(2)} × 12 por lado`]]
                                                : [['pallof',`${s(3)} × 12 por lado`],['prancha',`${s(3)} × 45 s`]]});
  }
  else if(arch==='LOWER2'){
    S.blocks.push({n:'Volume principal',meta:rest.sec,it:[['legpress',`${s(4)} × 12`],['stiff',`${s(4)} × 10`]]});
    S.blocks.push({n:'Isolamento',meta:rest.acc,it:[['afundo',`${s(3)} × 12 por perna`],['flexora',`${s(4)} × 15`],['panturrilha',`${s(4)} × 20`]]});
    S.blocks.push({n:'Tronco',meta:rest.acc,it:[['abwheel',`${s(3)} × 10`],['hollow',`${s(3)} × 30 s`]]});
  }
  else if(arch==='UPPER'){
    S.blocks.push({n:'Força principal',meta:rest.forca,it:[['supino',`${s(4)} × ${forca?'5':'6–8'}`],['remada',`${s(4)} × 8`]]});
    S.blocks.push({n:'Secundário',meta:rest.sec,it:[['desenv',`${s(3)} × 8–10`],[taf?'barra':'puxada',taf?`${s(4)} × máximo menos 2`:`${s(3)} × 10`]]});
    S.blocks.push({n:'Acessórios',meta:rest.acc,it:[['triceps',`${s(3)} × 12`],['rosca',`${s(3)} × 12`],['facepull',`${s(3)} × 15`]]});
    if(taf) S.blocks.push({n:'Densidade do teste',meta:`Método: EMOM ${6+B.ds*2} min`,
      it:[['flexao',`${6+B.ds*2} repetições no início de cada minuto`]]});
  }
  else if(arch==='UPPER2'){
    S.blocks.push({n:'Volume principal',meta:rest.sec,it:[['inclinado',`${s(4)} × 10`],['puxada',`${s(4)} × 12`]]});
    S.blocks.push({n:'Complementar',meta:rest.acc,it:[['desenv',`${s(3)} × 12`],['remada',`${s(3)} × 12`]]});
    S.blocks.push({n:'Isolamento',meta:rest.acc,it:[['rosca',`${s(4)} × 12`],['triceps',`${s(4)} × 12`],['facepull',`${s(3)} × 20`]]});
  }
  else if(arch==='FULL'||arch==='FULLA'){
    S.blocks.push({n:'Padrões principais',meta:rest.forca,it:[['agacho',`${s(4)} × 6`],['supino',`${s(4)} × 6`],['barra',`${s(4)} × máximo menos 2`]]});
    S.blocks.push({n:'Complementar',meta:rest.sec,it:[['stiff',`${s(3)} × 8`],['desenv',`${s(3)} × 8`]]});
    S.blocks.push({n:'Finalização',meta:'Bloco contínuo',it: cond?[['swing',`${s(3)} × 20`],['farmer',`${s(3)} × 40 m`]]
                                                             : [['abwheel',`${s(3)} × 10`],['prancha',`${s(3)} × 45 s`]]});
  }
  else if(arch==='FULLB'){
    S.blocks.push({n:'Padrões principais',meta:rest.forca,it:[['terra',`${s(4)} × 5`],['desenv',`${s(4)} × 6`],['remada',`${s(4)} × 8`]]});
    S.blocks.push({n:'Complementar',meta:rest.sec,it:[['afundo',`${s(3)} × 10 por perna`],[taf?'flexao':'triceps',taf?`${s(3)} × máximo menos 3`:`${s(3)} × 12`]]});
    S.blocks.push({n:'Condicionamento',meta:'Bloco contínuo',it:[['burpee',`${s(3)} × 10`],['prancha',`${s(3)} × 45 s`]]});
  }
  else if(arch==='METCON'){
    const C=CIRCUITS[bw];
    S.circuit=C;
    S.blocks.push({n:C.t,meta:`Método: ${C.metodo||'circuito'}`,desc:C.d,alvo:C.alvo,it:C.it});
    S.blocks.push({n:'Finalização de pegada',meta:rest.acc,it:[['farmer',`${s(3)} × 40 m pesado`],['prancha',`${s(2)} × 45 s`]]});
  }
  else if(arch==='TAF'){
    const alvoBarra=Math.max(3,Math.round(((p.taf&&p.taf.barra)||8)*0.5));
    S.blocks.push({n:'Puxada vertical em volume',meta:'Pausa de 15 s entre mini-séries',
      it:[['barra',`${s(5)} clusters de ${alvoBarra} + ${alvoBarra}`]]});
    S.blocks.push({n:'Empurrar em densidade',meta:`Método: EMOM ${8+B.ds*2} min`,
      it:[['flexao',`${Math.max(6,Math.round(((p.taf&&p.taf.flexao)||24)*0.35))} repetições no início de cada minuto`]]});
    S.blocks.push({n:'Suporte',meta:rest.sec,it:[['inclinado',`${s(3)} × 10`],['remada',`${s(3)} × 10`],['facepull',`${s(3)} × 15`]]});
    S.blocks.push({n:'Tronco em ritmo de prova',meta:rest.acc,it:[['abdominal',`${s(2)} × 1 min cronometrado`],['hollow',`${s(2)} × 30 s`]]});
  }
  else if(arch==='RUN'){
    const pc=paces(p);
    if(bw===1)      S.blocks.push({n:'Sessão contínua',meta:'Intensidade: RPE 5',it:[['runEasy',`5 km entre ${pc.easyA} e ${pc.easyB} por km`]]});
    else if(bw===2) S.blocks.push({n:'Blocos de limiar',meta:'90 s de trote entre os blocos',it:[['runLimiar',`3 × 8 min a ${pc.limiar} por km`]]});
    else if(bw===3) S.blocks.push({n:'Intervalado',meta:'2 min de trote entre os tiros',it:[['runVO2',`6 × 800 m a ${pc.vo2} por km`]]});
    else            S.blocks.push({n:'Regenerativo',meta:'Intensidade: RPE 4–5',it:[['runEasy',`3–4 km a ${pc.easyB} por km`]]});
    S.blocks.push({n:'Depois da corrida',meta:'Obrigatório',it:[['prancha','2 × 45 s'],['panturrilha','2 × 20 no degrau'],['alongGeral','4 posições de 40 s']]});
  }
  else if(arch==='MOB'){
    S.blocks.push({n:'Mobilidade guiada',meta:'Sem carga externa relevante',
      it:[['mobQuadril','3 × 8 transições por lado'],['mobToracica','3 × 10 por lado'],
          ['alongGeral','6 posições de 40 s'],['respiracao','5 min']]});
    S.blocks.push({n:'Ativação leve',meta:rest.acc,it:[['prancha',`${Math.max(2,s(2))} × 30 s`],['caminhada','15–20 min opcional']]});
  }
  /* Saúde: aeróbico contínuo em intensidade Zona 2 como suporte, não como principal */
  if(mainGoal==='saude' && arch!=='MOB'){
    S.blocks.push({n:'Base aeróbica',meta:'Intensidade: Zona 2, RPE 5–6',
      it:[['zona2','30 a 40 minutos contínuos']]});
  }
  /* Objetivo de desempenho atlético soma um bloco de potência quando não é dia de RUN nem TAF */
  if(desemp && !taf && arch!=='RUN' && arch!=='TAF' && arch!=='MOB'){
    S.blocks.push({n:'Potência atlética',meta:'Método: contraste força-velocidade',
      it:[['boxjump',`${s(3)} × 5`],['clean',`${s(3)} × 3`]]});
  }
  /* Emagrecimento adiciona um fechamento aeróbico curto quando o dia não é METCON/RUN */
  if(mainGoal==='emagrecimento' && arch!=='METCON' && arch!=='RUN' && arch!=='MOB'){
    S.blocks.push({n:'Fechamento aeróbico',meta:'Intensidade: Zona 2, RPE 5–6',
      it:[['zona2','20 a 25 minutos contínuos']]});
  }
  return S;
}

/* ================================================================
   10. ZONAS DE CORRIDA
   Deriva os ritmos de treino do tempo real informado pela pessoa.
   ================================================================ */
function vdotFrom(dist,secs){
  if(!dist||!secs) return 0;
  const t=secs/60, v=dist/t;
  const vo2=-4.60+0.182258*v+0.000104*v*v;
  const pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  return vo2/pct;
}
function velFromVO2(vo2){const a=0.000104,b=0.182258,c=-(4.60+vo2);
  return (-b+Math.sqrt(b*b-4*a*c))/(2*a)}
function paceAt(vd,pct){const v=velFromVO2(vd*pct);return v>0?1000/v*60:0}
function paces(p){
  const T=p.taf||{}, ref=T.corridaDist&&T.corridaTempo
    ? {d:Number(T.corridaDist),s:timeToSec(T.corridaTempo)} : null;
  if(!ref||!ref.d||!ref.s) return {vdot:0,easyA:'6:40',easyB:'7:30',limiar:'5:45',vo2:'5:10',longo:'7:10',prova:'—'};
  const vd=vdotFrom(ref.d,ref.s);
  return {vdot:vd.toFixed(1),
    easyA:mmss(paceAt(vd,.72)), easyB:mmss(paceAt(vd,.62)),
    longo:mmss(paceAt(vd,.66)), limiar:mmss(paceAt(vd,.86)),
    vo2:mmss(paceAt(vd,.98)),   prova:mmss(ref.s/(ref.d/1000))};
}

/* ================================================================
   11. MOTOR ADAPTATIVO
   Duas entradas: histórico de RPE por exercício e prontidão do dia.
   ================================================================ */
function lastPerf(p,exId){
  const keys=Object.keys(p.state.sessions||{}).sort().reverse();
  for(const k of keys){
    const e=(p.state.sessions[k].exercises||[]).find(x=>x.id===exId&&x.load);
    if(e) return {load:e.load,rpe:Number(e.rpe)||0,date:k};
  }
  return null;
}
const HEAVY=['agacho','terra','stiff','legpress','afundo','stepup','panturrilha','flexora'];
function lastSessionFeedback(p){
  const keys=Object.keys(p.state.sessions||{}).sort().reverse();
  for(const k of keys){ const s=p.state.sessions[k]; if(s.postFeedback) return s.postFeedback; }
  return null;
}
function suggest(p,exId){
  const L=lastPerf(p,exId); if(!L) return null;
  const CB=comebackOn(p,SEL);
  if(CB && L.date<CB.startKey){
    /* nenhuma carga registrada desde o início da retomada: parte da última antes da pausa */
    const kgPre=parseFloat(String(L.load).replace(',','.'));
    if(isFinite(kgPre)){
      const f=v=>String(Math.round(v*2)/2).replace('.',',');
      return {txt:`Retomada: ${f(kgPre*(1-CB.reduction))} kg (−${Math.round(CB.reduction*100)}% dos ${f(kgPre)} kg pré-pausa)`,cls:'chip w'};
    }
    return {txt:`Retomada: comece mais leve que na última vez (${L.load})`,cls:'chip w'};
  }
  const kg=parseFloat(String(L.load).replace(',','.'));
  const fb=lastSessionFeedback(p);
  /* dor relatada no feedback pós-treino tem prioridade sobre o RPE isolado */
  if(fb && fb.dor>=4 && HEAVY.includes(exId)){
    if(!isFinite(kg)) return {txt:'Última sessão relatou dor — priorize técnica hoje',cls:'chip d'};
    const fmt=v=>String(Math.round(v*2)/2).replace('.',',');
    return {txt:`Reduzir para ${fmt(kg*0.9)} kg · dor relatada na última sessão`,cls:'chip d'};
  }
  if(!isFinite(kg)) return {txt:`Última vez: ${L.load}${L.rpe?` · RPE ${L.rpe}`:''}`,cls:'chip'};
  const step=HEAVY.includes(exId)?5:2.5;
  const fmt=v=>String(Math.round(v*2)/2).replace('.',',');
  if(L.rpe&&L.rpe<=6)  return {txt:`Subir para ${fmt(kg+step)} kg`,cls:'chip a'};
  if(L.rpe&&L.rpe>=9)  return {txt:`Reduzir para ${fmt(kg*0.92)} kg · RPE ${L.rpe} na última`,cls:'chip w'};
  return {txt:`Manter ${fmt(kg)} kg e buscar mais uma repetição`,cls:'chip g'};
}
const RDQ=[['sono','Qualidade do sono'],['dor','Ausência de dor muscular'],['stress','Estresse sob controle'],['energia','Energia disponível']];
function readiness(r){
  if(!r) return null;
  const t=RDQ.reduce((a,[k])=>a+(Number(r[k])||3),0);
  if(t>=17) return {t,cls:'g',lbl:'PRONTO',cut:0,msg:'Sistema recuperado. Execute a sessão integral e busque progressão de carga.'};
  if(t>=13) return {t,cls:'a',lbl:'APTO',cut:0,msg:'Condição normal. Mantenha a carga planejada e o RPE do bloco.'};
  if(t>=9)  return {t,cls:'w',lbl:'REDUZIDO',cut:1,msg:'Corte uma série dos acessórios e limite o RPE a 7. Preserve os movimentos principais.'};
  return {t,cls:'d',lbl:'COMPROMETIDO',cut:2,msg:'Faça apenas aquecimento, mobilidade e caminhada leve. Registre como descanso e volte amanhã.'};
}

/* ================================================================
   11b. RETOMADA AUTOMÁTICA
   Mede quantos dias se passaram desde a última atividade registrada
   (treino concluído, corrida ou atividade livre). Acima de 14 dias,
   reinicia o ciclo na fase BASE e reduz volume, RPE e carga por um
   período proporcional à pausa.
   ================================================================ */
const COMEBACK_TIERS=[
  {tier:'longa', min:60, dias:21, red:0.30, rpe:'5–6', lbl:'Pausa longa'},
  {tier:'media', min:30, dias:14, red:0.20, rpe:'5–6', lbl:'Pausa de um mês ou mais'},
  {tier:'curta', min:14, dias:7,  red:0.10, rpe:'6',   lbl:'Pausa curta'}
];
const tierRank=t=>({curta:1,media:2,longa:3}[t]||0);
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/864e5); }
function lastActivityKey(p,today){
  today=today||todayKey();
  const ks=[];
  Object.values(p.state.sessions||{}).forEach(x=>{ if(x&&x.type!=='descanso'&&x.date) ks.push(x.date); });
  (p.state.runs||[]).forEach(r=>r.dateKey&&ks.push(r.dateKey));
  (p.state.activities||[]).forEach(a=>a.dateKey&&ks.push(a.dateKey));
  const past=ks.filter(k=>k<=today).sort();
  return past.length?past[past.length-1]:null;
}
/* Retorna true quando alterou o perfil (e ele precisa ser salvo). */
function checkComeback(p,today){
  today=today||todayKey();
  let changed=false;
  const cb=p.comeback;
  /* fim do período: devolve o nível original, se tinha sido rebaixado */
  if(cb && cb.untilKey<=today && cb.prevLevel && !cb.restored){ p.level=cb.prevLevel; cb.restored=true; changed=true; }
  const last=lastActivityKey(p,today);
  if(!last) return changed;
  const gap=daysBetween(last,today);
  const T=COMEBACK_TIERS.find(t=>gap>=t.min);
  if(!T) return changed;
  /* mesma pausa já tratada no mesmo nível ou acima: nada a fazer */
  if(cb && cb.lastActivity===last && tierRank(cb.tier)>=tierRank(T.tier)) return changed;
  const origLevel=(cb&&cb.lastActivity===last&&cb.prevLevel)?cb.prevLevel:p.level;
  p.comeback={tier:T.tier,gap,lastActivity:last,startKey:today,untilKey:addDays(today,T.dias),
    reduction:T.red,rpe:T.rpe,prevLevel:null,restored:false,seen:false};
  if(T.tier==='longa' && !['return','beginner'].includes(origLevel)){
    p.comeback.prevLevel=origLevel; p.level='return';
  }
  p.cycleStart=today;                 /* periodização recomeça na semana BASE */
  return true;
}
function comebackOn(p,dateKey){
  const c=p&&p.comeback;
  return (c && dateKey>=c.startKey && dateKey<c.untilKey) ? c : null;
}
function comebackText(c){
  const T=COMEBACK_TIERS.find(t=>t.tier===c.tier)||COMEBACK_TIERS[2];
  let t=`Foram ${c.gap} dias sem treino registrado. Até ${fmtBR(c.untilKey)} o plano fica em modo de retomada: `+
    `ciclo reiniciado na fase BASE, uma série a menos por exercício, RPE limitado a ${c.rpe} `+
    `e cargas sugeridas ${Math.round(c.reduction*100)}% abaixo das últimas registradas antes da pausa.`;
  if(c.prevLevel) t+=` O nível fica em "Retornando" nesse período e volta a "${(LEVELS[c.prevLevel]||{}).lbl||c.prevLevel}" depois.`;
  return {titulo:T.lbl,texto:t};
}

/* ================================================================
   12. PERSISTÊNCIA
   Tenta o armazenamento do ambiente e cai para o do navegador,
   de modo que o arquivo funcione hospedado ou baixado.
   ================================================================ */
const KEY='treino_simples_v9';
const KEY_LEGACY='treino_hibrido_v7';
const Store=(()=>{
  const mem={};
  const art = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
  let ls=false;
  if(!art){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls=true; }catch(e){ ls=false; } }
  return {
    kind: art?'ambiente':(ls?'navegador':'memória'),
    async get(k){ try{
        if(art){ const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):null; }
        if(ls){ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }
      }catch(e){} return mem[k]||null; },
    async set(k,v){ const s=JSON.stringify(v); mem[k]=v; try{
        if(art){ await window.storage.set(k,s); return true; }
        if(ls){ localStorage.setItem(k,s); return true; }
      }catch(e){ return false; } return true; }
  };
})();

/* Mapa de compatibilidade: os 4 objetivos antigos (v7) viram
   objetivos válidos na taxonomia de 11 (v8), sem apagar histórico. */
const GOAL_MIGRATE={operational:'condicionamento',hybrid:'forca',aesthetic:'estetica',taf:'taf'};
/* Compatibilidade: perfis de versões anteriores continuam válidos. */
function migrate(d){
  if(!d||!d.profiles||!d.profiles.length) return null;
  d.profiles.forEach(p=>{
    p.state=p.state||{}; p.state.days=p.state.days||{};
    p.state.sessions=p.state.sessions||{}; p.state.runs=p.state.runs||[]; p.state.activities=p.state.activities||[];
    if(!Array.isArray(p.goals)) p.goals=[p.goal||'forca'];
    p.goals=p.goals.map(g=>GOALS[g]?g:(GOAL_MIGRATE[g]||'forca'));
    if(!p.goals.length) p.goals=['forca'];
    if(!p.mainGoal||!p.goals.includes(p.mainGoal)) p.mainGoal=p.goals[0];
    if(!Array.isArray(p.locations)) p.locations=[p.defaultMode||'full'];
    p.days=p.days||3; p.level=p.level||'intermediate';
    p.defaultMode=p.defaultMode||(p.locations.includes('full')?'full':p.locations[0]);
    p.cycleStart=p.cycleStart||todayKey();
    p.taf=Object.assign({barra:0,flexao:0,abdominal:0,corridaDist:2400,corridaTempo:'',natacaoDist:200,natacaoTempo:''},p.taf||{});
    p.identity=p.identity||'';
    p.age=p.age||null; p.heightCm=p.heightCm||null; p.weightKg=p.weightKg||null;
    p.imc=calcIMC(p.weightKg,p.heightCm);
    p.restrictions=!!p.restrictions; p.restrictionsDesc=p.restrictionsDesc||'';
  });
  if(!d.profiles.find(p=>p.id===d.activeId)) d.activeId=d.profiles[0].id;
  return d;
}

function sessionItems(S,ds){
  /* aplica o corte de volume sugerido pela prontidão e o editor */
  const custom=ds.custom;
  return S.blocks.map((b,bi)=>({...b, it:b.it.map(([id,pres],ii)=>{
    const key=`${bi}_${ii}`;
    return [id, (custom&&custom[key])||pres, key];
  })}));
}
function countTotal(S){ return (S.warm?S.warm.length:0)+S.blocks.reduce((a,b)=>a+b.it.length,0); }
function countDone(S,ds){
  let n=0; (S.warm||[]).forEach((_,i)=>{ if(ds.warmDone['w'+i]) n++; });
  S.blocks.forEach((b,bi)=>b.it.forEach((_,ii)=>{ if(ds.done[`${bi}_${ii}`]) n++; }));
  return n;
}
function warmDoneAll(S,ds){ return (S.warm||[]).every((_,i)=>ds.warmDone['w'+i]); }
function mainDoneAll(S,ds){ return S.blocks.every((b,bi)=>b.it.every((_,ii)=>ds.done[`${bi}_${ii}`])); }

    b.it.forEach(([id,pres,key])=>{

function saveActivity(){
  const name=$('#aN').value.trim(), d=$('#aD').value, min=$('#aM').value;
  if(!name||!d||!min) return toast('Preencha o nome, a data e a duração');
  P.state.activities=P.state.activities||[];
  P.state.activities.push({id:uid(),date:new Date().toISOString(),dateKey:d,
    name,minutes:min,rpe:$('#aR').value||'',note:$('#aO').value.trim()});
  save(); render(); toast('Atividade registrada');
}

function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){ const k=iso(d);
    if(P.state.sessions[k]) n++; else if(i>0) break;
    d.setDate(d.getDate()-1); }
  return n;
}

function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function prepCanvas(cv,h){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||320;
  cv.width=W*dpr; cv.height=h*dpr;
  const c=cv.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,W,h);
  return {c,W,H:h};
}
function chartVolume(){
  const cv=$('#cVol'); if(!cv) return;
  const {c,W,H}=prepCanvas(cv,150);
  const weeks=[], now=new Date();
  const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  for(let w=7;w>=0;w--){
    const a=new Date(mon); a.setDate(mon.getDate()-w*7);
    let n=0;
    for(let i=0;i<7;i++){ const d=new Date(a); d.setDate(a.getDate()+i);
      const s=P.state.sessions[iso(d)]; if(s&&s.type!=='descanso') n+=(s.exercises||[]).length; }
    weeks.push({n,lbl:String(a.getDate()).padStart(2,'0')+'/'+String(a.getMonth()+1).padStart(2,'0')});
  }
  const max=Math.max(6,...weeks.map(w=>w.n));
  const pad={l:26,r:8,t:12,b:22}, bw=(W-pad.l-pad.r)/weeks.length;
  c.strokeStyle=cssv('--line'); c.lineWidth=1;
  for(let i=0;i<=3;i++){ const y=pad.t+(H-pad.t-pad.b)*i/3;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(W-pad.r,y); c.stroke();
    c.fillStyle=cssv('--muted'); c.font='10px JetBrains Mono, monospace'; c.textAlign='right';
    c.fillText(String(Math.round(max*(1-i/3))),pad.l-5,y+3); }
  weeks.forEach((w,i)=>{
    const hgt=(H-pad.t-pad.b)*(w.n/max), x=pad.l+i*bw+bw*0.2, y=H-pad.b-hgt;
    c.fillStyle=i===weeks.length-1?cssv('--accent'):cssv('--accent2');
    c.globalAlpha=i===weeks.length-1?1:.55;
    c.beginPath(); c.roundRect(x,y,bw*0.6,Math.max(hgt,1),3); c.fill(); c.globalAlpha=1;
    c.fillStyle=cssv('--muted'); c.font='9px JetBrains Mono, monospace'; c.textAlign='center';
    c.fillText(w.lbl,x+bw*0.3,H-7);
  });
}
function chartLoad(exId){
  const cv=$('#cLoad'); if(!cv||!exId) return;
  const {c,W,H}=prepCanvas(cv,150);
  const pts=[];
  Object.keys(P.state.sessions).sort().forEach(k=>{
    const e=(P.state.sessions[k].exercises||[]).filter(x=>x.id===exId&&x.load)
      .map(x=>parseFloat(String(x.load).replace(',','.'))).filter(v=>isFinite(v));
    if(e.length) pts.push({k,v:Math.max(...e)});
  });
  const pad={l:34,r:10,t:14,b:22};
  if(pts.length<2){ c.fillStyle=cssv('--muted'); c.font='12px Barlow, sans-serif'; c.textAlign='center';
    c.fillText('Registre em pelo menos duas sessões',W/2,H/2); return; }
  const vals=pts.map(p=>p.v), mn=Math.min(...vals)*0.92, mx=Math.max(...vals)*1.06;
  const X=i=>pad.l+(W-pad.l-pad.r)*(i/(pts.length-1));
  const Y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-mn)/(mx-mn||1));
  c.strokeStyle=cssv('--line');
  for(let i=0;i<=3;i++){ const y=pad.t+(H-pad.t-pad.b)*i/3;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(W-pad.r,y); c.stroke();
    c.fillStyle=cssv('--muted'); c.font='10px JetBrains Mono, monospace'; c.textAlign='right';
    c.fillText((mx-(mx-mn)*i/3).toFixed(0),pad.l-5,y+3); }
  const g=c.createLinearGradient(0,pad.t,0,H-pad.b);
  g.addColorStop(0,cssv('--accent')+'55'); g.addColorStop(1,cssv('--accent')+'00');
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.v)):c.moveTo(X(i),Y(p.v)));
  c.lineTo(X(pts.length-1),H-pad.b); c.lineTo(X(0),H-pad.b); c.closePath(); c.fillStyle=g; c.fill();
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.v)):c.moveTo(X(i),Y(p.v)));
  c.strokeStyle=cssv('--accent'); c.lineWidth=2; c.stroke();
  pts.forEach((p,i)=>{ c.beginPath(); c.arc(X(i),Y(p.v),3.2,0,7); c.fillStyle=cssv('--accent'); c.fill(); });
  c.fillStyle=cssv('--muted'); c.font='9px JetBrains Mono, monospace'; c.textAlign='center';
  c.fillText(fmtBR(pts[0].k),X(0)+8,H-7);
  c.fillText(fmtBR(pts[pts.length-1].k),X(pts.length-1)-8,H-7);
}
const TAFAX=[{k:'barra',l:'BARRA',inv:0},{k:'flexao',l:'FLEXÃO',inv:0},{k:'abdominal',l:'ABDOMINAL',inv:0},
  {k:'corridaTempo',l:'CORRIDA',inv:1},{k:'natacaoTempo',l:'NATAÇÃO',inv:1}];
function chartRadar(){
  const cv=$('#cRadar'); if(!cv) return;
  const {c,W,H}=prepCanvas(cv,235);
  const cx=W/2, cy=H/2+4, R=Math.min(W,H)/2-46, N=5;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  for(let r=1;r<=4;r++){ c.beginPath();
    for(let i=0;i<N;i++){ const a=ang(i),x=cx+Math.cos(a)*R*r/4,y=cy+Math.sin(a)*R*r/4; i?c.lineTo(x,y):c.moveTo(x,y); }
    c.closePath(); c.strokeStyle=cssv(r===4?'--muted':'--line'); c.lineWidth=1; c.stroke(); }
  for(let i=0;i<N;i++){ const a=ang(i); c.beginPath(); c.moveTo(cx,cy);
    c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); c.strokeStyle=cssv('--line'); c.stroke(); }
  const T=P.taf||{}, M=T.metas||{};
  const val=ax=>{
    const cur=T[ax.k], meta=M[ax.k];
    if(!cur||!meta) return 0;
    const a=ax.inv?timeToSec(cur):Number(cur), b=ax.inv?timeToSec(meta):Number(meta);
    if(!a||!b) return 0;
    return clamp(ax.inv?b/a:a/b,0,1.08);
  };
  const pts=TAFAX.map((ax,i)=>{const v=val(ax),a=ang(i);return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]});
  const any=TAFAX.some(ax=>val(ax)>0);
  if(any){
    c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath();
    c.fillStyle=cssv('--accent')+'2e'; c.fill();
    c.strokeStyle=cssv('--accent'); c.lineWidth=2; c.stroke();
    pts.forEach(p=>{ c.beginPath(); c.arc(p[0],p[1],3.4,0,7); c.fillStyle=cssv('--accent'); c.fill(); });
  }else{
    c.fillStyle=cssv('--muted'); c.font='12px Barlow, sans-serif'; c.textAlign='center';
    c.fillText('Informe marcas e metas para desenhar',cx,cy);
  }
  c.textAlign='center'; c.textBaseline='middle';
  TAFAX.forEach((ax,i)=>{ const a=ang(i), x=cx+Math.cos(a)*(R+26), y=cy+Math.sin(a)*(R+20);
    c.fillStyle=cssv('--muted'); c.font='600 10px Barlow Condensed, sans-serif'; c.fillText(ax.l,x,y-6);
    c.fillStyle=cssv('--text'); c.font='700 12px JetBrains Mono, monospace';
    c.fillText(String(T[ax.k]||'—'),x,y+7); });
}

  if(TAB!=='evolucao') return;
  chartVolume(); chartRadar();
  const sel=$('#liftPick'); if(sel) chartLoad(sel.value);

let FB={dificuldade:3,dor:1,energia:3,concluido:true};
function finishDay(){
  const ds=dayState(SEL), S=buildSession(P,SEL);
  const ex=[];
  sessionItems(S,ds).forEach((b,bi)=>b.it.forEach(([id,pres,key])=>{
    ex.push({id,name:exName(id,ds.mode,ds.swaps[key]),category:(LIB[id]||{}).cat||'',
      prescription:pres,load:ds.loads[key]||'',rpe:ds.rpe[key]||'',completed:!!ds.done[key]});
  }));
  const v=readiness(ds.readiness);
  P.state.sessions[SEL]={date:SEL,completedAt:new Date().toISOString(),mode:ds.mode,
    title:S.title,profile:P.id,type:S.isRest?'descanso':'treino',
    block:S.block.nome,week:S.bw,readiness:v?v.t:null,exercises:ex,
    postFeedback:S.isRest?null:{...FB}};
  save(); closeSheet(); render();
  toast(S.isRest?'Descanso registrado':'Treino salvo. Dia bloqueado.');
}
function unlockDay(){
  if(!confirm('Reabrir este dia? O registro arquivado sai do histórico.')) return;
  delete P.state.sessions[SEL]; save(); render(); toast('Dia reaberto');
}
function adjustLoad(key,dir){
  const ds=dayState(SEL), cur=parseFloat(String(ds.loads[key]||'').replace(',','.'));
  if(!isFinite(cur)) return toast('Registre uma carga numérica primeiro');
  ds.loads[key]=String(Math.round((dir==='+'?cur*1.05:cur*0.9)*2)/2).replace('.',',');
  save(); render(); toast(dir==='+'?'Carga elevada em 5%':'Carga reduzida em 10%');
}

  const d=$('#rD').value, k=$('#rK').value.trim(), t=$('#rT').value.trim();

function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=migrate(JSON.parse(r.result));
        if(!d) return toast('Arquivo sem perfis válidos');
        if(!confirm('Substituir os dados atuais pelos do arquivo?')) return;
        if(USER){ const pp=d.profiles.find(x=>x.id===d.activeId)||d.profiles[0]; DB={activeId:pp.id,profiles:[pp]}; }
        else DB=d;
        save(); render(); toast('Cópia importada');
      }catch(e){ toast('Não foi possível ler o arquivo'); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------------- cronômetro de descanso ---------------- */
let RT=null, RTleft=0, HUE_SAVE_T=null;
function startRest(sec){
  RTleft=sec; $('#timer').classList.add('on'); updRest();
  clearInterval(RT);
  RT=setInterval(()=>{ RTleft--; updRest();
    if(RTleft<=0){ stopRest(); beep(); toast('Descanso concluído'); } },1000);
}
function updRest(){ $('#timerVal').textContent=mmss(Math.max(0,RTleft)); }
function stopRest(){ clearInterval(RT); RT=null; $('#timer').classList.remove('on'); }
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.45);
    o.start(); o.stop(a.currentTime+.5);
  }catch(e){}
}

function render(){
  P=DB.profiles.find(x=>x.id===DB.activeId)||DB.profiles[0];
  if(!P){ $('#tabs').classList.remove('on'); $('#screen').innerHTML=renderInterview(); return; }
  if(P.theme) applyTheme(P.theme);
  $('#tabs').classList.add('on');
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  const V={hoje:viewHoje,semana:viewSemana,evolucao:viewEvolucao,historico:viewHistorico,perfis:viewPerfis};
  $('#screen').innerHTML=`<div class="view on">${(V[TAB]||viewHoje)()}</div>`;
  $('#foot').textContent=footText();
  requestAnimationFrame(drawCharts);
}
function goTab(t){ TAB=t; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function shiftDay(n){ const d=parseKey(SEL); d.setDate(d.getDate()+n); SEL=iso(d); render(); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-iw],[data-goal],[data-maingoal],[data-level],[data-restr],[data-days],[data-loc],[data-theme],[data-act],[data-mode],[data-warm],[data-ex],[data-tech],[data-swap],[data-edit],[data-adj],[data-pick],[data-rest],[data-fbdone],[data-goday],[data-prof],[data-usetheme],[data-pgoal],[data-pmaingoal],[data-plevel],[data-prestr],[data-pdays],[data-ploc],[data-t]');
  if(!t) return;
  const d=t.dataset;

  if(d.tab) return goTab(d.tab);
  if(d.t){ if(d.t==='add'){RTleft+=30;updRest();} else stopRest(); return; }

  /* captura os campos de texto/número da etapa atual antes de qualquer transição */
  function captureStep(){
    if($('#iwName')) IW.name=$('#iwName').value;
    if($('#iwAge')) IW.age=$('#iwAge').value;
    if($('#iwH')) IW.heightCm=$('#iwH').value;
    if($('#iwW')) IW.weightKg=$('#iwW').value;
    if($('#iwRD')) IW.restrictionsDesc=$('#iwRD').value;
    if($('#iwId')) IW.identity=$('#iwId').value;
  }

  /* entrevista */
  if(d.iw){
    if(d.iw==='begin'){ IW={step:1,name:'',age:'',heightCm:'',weightKg:'',goals:[],mainGoal:'',level:'',
        restrictions:null,restrictionsDesc:'',days:0,locations:[],identity:'',themeIdx:0}; }
    else if(d.iw==='skip'){ if(DB.profiles.length){ IW.step=0; render(); return; } }
    else if(d.iw==='next'){ captureStep(); IW.step++; }
    else if(d.iw==='back'){ captureStep(); IW.step--; if(IW.step<1){ IW.step=0; } }
    else if(d.iw==='finish'){
      const np=newProfile({...draftProfile(),theme:THEMES[IW.themeIdx]});
      if(USER){ DB={activeId:np.id,profiles:[np]}; } else { DB.profiles.push(np); DB.activeId=np.id; } SEL=todayKey(); TAB='hoje';
      save(); render(); toast('Plano criado. Bom treino!'); return;
    }
    $('#screen').innerHTML=renderInterview();
    if(IW.step===1&&$('#iwName')) $('#iwName').focus();
    window.scrollTo({top:0}); return;
  }
  if(d.goal!==undefined){ captureStep(); const i=IW.goals.indexOf(d.goal);
    if(i<0){ IW.goals.push(d.goal); if(!IW.mainGoal) IW.mainGoal=d.goal; }
    else { IW.goals.splice(i,1); if(IW.mainGoal===d.goal) IW.mainGoal=IW.goals[0]||''; }
    $('#screen').innerHTML=renderInterview(); return; }
  if(d.maingoal){ captureStep(); IW.mainGoal=d.maingoal; $('#screen').innerHTML=renderInterview(); return; }
  if(d.level){ captureStep(); IW.level=d.level; $('#screen').innerHTML=renderInterview(); return; }
  if(d.restr){ captureStep(); IW.restrictions=(d.restr==='sim'); if(d.restr==='nao') IW.restrictionsDesc='';
    $('#screen').innerHTML=renderInterview(); return; }
  if(d.days){ captureStep(); IW.days=+d.days; $('#screen').innerHTML=renderInterview(); return; }
  if(d.loc){ captureStep(); const i=IW.locations.indexOf(d.loc);
    i<0?IW.locations.push(d.loc):IW.locations.splice(i,1);
    $('#screen').innerHTML=renderInterview(); return; }
  if(d.theme!==undefined){ IW.themeIdx=+d.theme; $('#screen').innerHTML=renderInterview(); return; }

  /* dia */
  if(d.goday){ SEL=d.goday; TAB='hoje'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.mode){ dayState(SEL).mode=d.mode; save(); closeSheet(); render(); toast('Adaptado para '+LOCLBL[d.mode].toLowerCase()); return; }
  if(d.warm!==undefined&&!isLocked(SEL)){ const s=dayState(SEL), k='w'+d.warm;
    s.warmDone[k]=!s.warmDone[k]; save(); render(); return; }
  if(d.ex&&!isLocked(SEL)){ const s=dayState(SEL); s.done[d.ex]=!s.done[d.ex]; save(); render(); return; }
  if(d.tech) return sheetTech(d.tech);
  if(d.swap){ const[k,id]=d.swap.split('|'); return sheetSwap(k,id); }
  if(d.edit){ const i=d.edit.indexOf('|'); return sheetEdit(d.edit.slice(0,i),d.edit.slice(i+1)); }
  if(d.adj){ const[k,dir]=d.adj.split('|'); return adjustLoad(k,dir); }
  if(d.pick){ const[k,m]=d.pick.split('|'); dayState(SEL).swaps[k]=m; save(); closeSheet(); render(); toast('Exercício trocado'); return; }
  if(d.rest) return startRest(+d.rest);
  if(d.fbdone){ FB.concluido=(d.fbdone==='sim');
    $$('[data-fbdone]').forEach(b=>b.classList.toggle('on',b.dataset.fbdone===d.fbdone));
    return; }

  /* perfis */
  if(d.prof){ DB.activeId=d.prof; SEL=todayKey(); save(); render(); toast('Perfil ativo alterado'); return; }
  if(d.usetheme!==undefined){ P.theme=THEMES[+d.usetheme]; applyTheme(P.theme); save(); closeSheet(); render(); toast('Tema aplicado'); return; }
  if(d.pgoal!==undefined){ P.goals=P.goals||[]; const i=P.goals.indexOf(d.pgoal);
    if(i<0){ P.goals.push(d.pgoal); if(!P.mainGoal) P.mainGoal=d.pgoal; }
    else if(P.goals.length>1){ P.goals.splice(i,1); if(P.mainGoal===d.pgoal) P.mainGoal=P.goals[0]; }
    sheetProfileEdit(); return; }
  if(d.pmaingoal){ P.mainGoal=d.pmaingoal; sheetProfileEdit(); return; }
  if(d.plevel){ P.level=d.plevel; sheetProfileEdit(); return; }
  if(d.prestr){ P.restrictions=(d.prestr==='sim'); if(d.prestr==='nao') P.restrictionsDesc=''; sheetProfileEdit(); return; }
  if(d.pdays){ P.days=+d.pdays; sheetProfileEdit(); return; }
  if(d.ploc!==undefined){ P.locations=P.locations||[]; const i=P.locations.indexOf(d.ploc);
    i<0?P.locations.push(d.ploc):(P.locations.length>1&&P.locations.splice(i,1)); sheetProfileEdit(); return; }

  switch(d.act){
    case 'close': return closeSheet();
    case 'prevDay': return shiftDay(-1);
    case 'nextDay': return shiftDay(1);
    case 'today': SEL=todayKey(); return render();
    case 'prevWeek': return shiftDay(-7);
    case 'nextWeek': return shiftDay(7);
    case 'rdSave': { const r={}; $$('[data-rd]').forEach(i=>r[i.dataset.rd]=+i.value);
      dayState(SEL).readiness=r; save(); render();
      const v=readiness(r); toast('Prontidão: '+v.lbl); return; }
    case 'rdReset': dayState(SEL).readiness=null; save(); return render();
    case 'finish': return finishDay();
    case 'openFeedback': return sheetFeedback();
    case 'unlock': return unlockDay();
    case 'runSave': return saveRun();
    case 'activitySave': return saveActivity();
    case 'allModes': return sheetAllModes();
    case 'editTaf': return sheetTaf();
    case 'tafSave': {
      P.taf={barra:+$('#tB').value||0,flexao:+$('#tF').value||0,abdominal:+$('#tA').value||0,
        corridaDist:+$('#tCD').value||2400,corridaTempo:$('#tCT').value.trim(),
        natacaoDist:+$('#tND').value||200,natacaoTempo:$('#tNT').value.trim(),
        metas:{barra:+$('#mB').value||0,flexao:+$('#mF').value||0,abdominal:+$('#mA').value||0,
          corridaTempo:$('#mCT').value.trim(),natacaoTempo:$('#mNT').value.trim()}};
      save(); closeSheet(); render(); toast('Marcas atualizadas'); return; }
    case 'changeTheme': return sheetThemes();
    case 'editProfile': return sheetProfileEdit();
    case 'profileSave': {
      P.name=$('#pfN').value.trim()||P.name;
      P.age=$('#pfAge').value||null; P.heightCm=$('#pfH').value||null; P.weightKg=$('#pfW').value||null;
      P.imc=calcIMC(P.weightKg,P.heightCm);
      if(P.restrictions&&$('#pfRD')) P.restrictionsDesc=$('#pfRD').value.trim();
      P.identity=$('#pfI').value.trim();
      P.cycleStart=$('#pfC').value||P.cycleStart;
      if(!P.mainGoal||!P.goals.includes(P.mainGoal)) P.mainGoal=P.goals[0];
      if(!P.locations.includes(P.defaultMode)) P.defaultMode=P.locations.includes('full')?'full':P.locations[0];
      save(); closeSheet(); render(); toast('Perfil atualizado'); return; }
    case 'newProfile': IW={step:1,name:'',age:'',heightCm:'',weightKg:'',goals:[],mainGoal:'',level:'',
        restrictions:null,restrictionsDesc:'',days:0,locations:[],identity:'',themeIdx:0};
      DB.activeId=null; P=null; $('#tabs').classList.remove('on');
      $('#screen').innerHTML=renderInterview(); window.scrollTo({top:0}); return;
    case 'delProfile': {
      if(DB.profiles.length<2) return;
      if(!confirm(`Excluir "${P.name}" e todo o histórico deste perfil?`)) return;
      DB.profiles=DB.profiles.filter(x=>x.id!==P.id); DB.activeId=DB.profiles[0].id;
      save(); render(); toast('Perfil excluído'); return; }
    case 'exportData': return exportData();
    case 'importData': return importData();
    case 'edSave': { const v=$('#edPres').value.trim(); const ds=dayState(SEL);
      ds.custom=ds.custom||{}; if(v) ds.custom[d.k]=v; else delete ds.custom[d.k];
      save(); closeSheet(); render(); toast('Prescrição ajustada'); return; }
    case 'edReset': { const ds=dayState(SEL); if(ds.custom) delete ds.custom[d.k];
      save(); closeSheet(); render(); toast('Prescrição original restaurada'); return; }
  }
});

   Cada usuário tem um documento users/{uid} com o perfil e uma
   subcoleção users/{uid}/sessions/{data} com os treinos concluídos.
   As regras do Firestore só permitem que o dono leia e grave.
   ================================================================ */

  apiKey:"AIzaSyApKOPcY3yT9BAUpQUJbjZxLuBNimXY31g",

let AUTH=null, FS=null, USER=null, SYNCED={}, SYNC_T=null, SYNC_STATE='', LOCALIMPORT=null;
let AUTHV={mode:'login',err:'',ok:'',busy:false,email:''};
const cacheKey=()=>KEY+'_u_'+(USER?USER.uid:'x');
const cloudReady=()=>typeof firebase!=='undefined'&&typeof firebase.initializeApp==='function';
const clean=o=>JSON.parse(JSON.stringify(o));
function stable(o){
  if(Array.isArray(o)) return '['+o.map(stable).join(',')+']';
  if(o&&typeof o==='object') return '{'+Object.keys(o).sort().filter(k=>o[k]!==undefined)
    .map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined?null:o);
}
function cloudInit(){
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CFG);
  AUTH=firebase.auth(); FS=firebase.firestore();
  try{ FS.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
}
function syncLabel(){
  if(!USER) return 'neste aparelho';
  if(SYNC_STATE==='pending') return navigator.onLine===false?'offline · envia ao reconectar':'salvando…';
  if(SYNC_STATE==='err') return 'falha ao sincronizar';
  return 'sincronizado';
}
function footText(){
  return USER?`Treino Simples · ${USER.email} · ${syncLabel()}`:`Treino Simples · dados salvos no ${Store.kind}`;
}
function setSync(st){ SYNC_STATE=st; const f=$('#foot'); if(f) f.textContent=footText(); }
function pruneDays(days){
  const lim=addDays(todayKey(),-60), out={};
  Object.keys(days||{}).forEach(k=>{ if(k>=lim) out[k]=days[k]; });
  return out;
}
async function pushCloud(){
  const p=DB.profiles[0]; if(!p||!USER||!FS) return;
  const uref=FS.collection('users').doc(USER.uid);
  const prof=clean(p); prof.state=prof.state||{};
  delete prof.state.sessions; prof.state.days=pruneDays(prof.state.days);
  const ops=[{t:'set',ref:uref,data:{profile:prof,email:USER.email,updatedAt:new Date().toISOString()}}];
  const sess=p.state.sessions||{}, next={};
  Object.keys(sess).forEach(k=>{ const str=stable(sess[k]); next[k]=str;
    if(SYNCED[k]!==str) ops.push({t:'set',ref:uref.collection('sessions').doc(k),data:clean(sess[k])}); });
  Object.keys(SYNCED).forEach(k=>{ if(!(k in sess)) ops.push({t:'del',ref:uref.collection('sessions').doc(k)}); });
  try{
    for(let i=0;i<ops.length;i+=400){
      const b=FS.batch();
      ops.slice(i,i+400).forEach(o=>o.t==='set'?b.set(o.ref,o.data):b.delete(o.ref));
      await b.commit();
    }
    SYNCED=next; setSync('ok');
  }catch(e){
    console.error('sync',e); setSync('err');
    clearTimeout(SYNC_T); SYNC_T=setTimeout(pushCloud,15000);
  }
}
async function pullCloud(uid){
  const uref=FS.collection('users').doc(uid);
  const snap=await uref.get();
  if(!snap.exists) return {exists:false};
  const data=snap.data()||{}; const p=data.profile;
  if(!p) return {exists:false};
  const ss=await uref.collection('sessions').get();
  p.state=p.state||{}; p.state.sessions={}; SYNCED={};
  ss.forEach(d=>{ const v=d.data(); p.state.sessions[d.id]=v; SYNCED[d.id]=stable(v); });
  return {exists:true,db:{activeId:p.id,profiles:[p]}};
}
window.addEventListener('online',()=>{ if(USER&&SYNC_STATE!=='ok') pushCloud(); });

function authMsg(e){
  const c=(e&&e.code)||'';
  const M={'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.',
    'auth/user-not-found':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Use "Entrar".',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.',
    'auth/operation-not-allowed':'Login por e-mail não está ativado no Firebase.'};
  return M[c]||'Não foi possível concluir. Tente de novo.';
}
async function authSubmit(){
  const m=AUTHV.mode, email=($('#auE')||{}).value?$('#auE').value.trim():'';
  const pw=$('#auP')?$('#auP').value:'', pw2=$('#auP2')?$('#auP2').value:'';
  AUTHV.email=email; AUTHV.err=''; AUTHV.ok='';
  if(!email){ AUTHV.err='Digite seu e-mail.'; return renderAuth(); }
  if(m!=='reset'&&!pw){ AUTHV.err='Digite a senha.'; return renderAuth(); }
  if(m==='signup'&&pw.length<6){ AUTHV.err='A senha precisa ter pelo menos 6 caracteres.'; return renderAuth(); }
  if(m==='signup'&&pw!==pw2){ AUTHV.err='As senhas não conferem.'; return renderAuth(); }
  AUTHV.busy=true; renderAuth();
  try{
    if(m==='signup') await AUTH.createUserWithEmailAndPassword(email,pw);
    else if(m==='login') await AUTH.signInWithEmailAndPassword(email,pw);
    else { await AUTH.sendPasswordResetEmail(email); AUTHV.busy=false; AUTHV.mode='login';
      AUTHV.ok='Link enviado. Confira seu e-mail, inclusive a caixa de spam.'; return renderAuth(); }
    AUTHV.busy=false;           /* onAuthStateChanged assume daqui */
  }catch(e){ AUTHV.busy=false; AUTHV.err=authMsg(e); renderAuth(); }
}

async function onUser(u){
  if(!u){ USER=null; SYNCED={}; DB={activeId:null,profiles:[]}; P=null; closeSheet(); return renderAuth(); }
  USER=u; showLoading('Carregando seus treinos…');
  let r=null;
  try{ r=await pullCloud(u.uid); }
  catch(e){
    const cached=migrate(await Store.get(cacheKey()));
    if(cached){ DB=cached; SYNCED={}; afterLoad(); setSync('pending'); return; }
    return renderCloudError('Não foi possível carregar seus treinos. Confira a internet e tente de novo.',false);
  }
  if(r.exists){ DB=migrate(r.db); afterLoad(); return; }
  /* conta nova: oferece trazer o perfil da versão sem conta, se houver */
  const local=migrate(await Store.get(KEY))||migrate(await Store.get(KEY_LEGACY));
  if(local&&local.profiles.length){ LOCALIMPORT=local; return renderImport(); }
  DB={activeId:null,profiles:[]}; P=null;
  IW.step=0; $('#tabs').classList.remove('on'); $('#screen').innerHTML=renderInterview(); $('#foot').textContent='';
}
async function startLocal(){
  USER=null;

  if(!raw){ const legacy=await Store.get(KEY_LEGACY); if(legacy){ raw=legacy; await Store.set(KEY,legacy); } }
  DB=migrate(raw)||{activeId:null,profiles:[]};
  if(!DB.profiles.length){ IW.step=0; $('#screen').innerHTML=renderInterview(); $('#foot').textContent=''; }
  else { if(DB.profiles.some(p=>checkComeback(p))) await save(); await save(); render(); }
}
